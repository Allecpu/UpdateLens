jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      # Build frontend (Vite -> dist)
      - name: Build client
        run: npm run build

      # Build server (TS -> server-dist)
      - name: Build server
        run: npm run build:server

      - name: Create deploy package (dist + server-dist + prod deps only)
        run: |
          rm -rf deploy
          mkdir -p deploy

          cp package.json package-lock.json deploy/
          cp -R server-dist deploy/server-dist
          cp -R dist deploy/dist

          npm ci --omit=dev --prefix deploy

          cd deploy
          zip -r ../deploy.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy.zip
