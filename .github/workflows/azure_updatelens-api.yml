name: Build and deploy Node.js app to Azure Web App - updatelens-api

on:
  push:
    branches:
      - Azure
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install completo (serve per compilare server-dist)
      - name: Install deps
        run: npm ci

      # Compila il server
      - name: Build server
        run: npm run build:server

      # Crea una cartella di deploy "pulita" e installa SOLO deps production lì dentro
      - name: Create deploy package (prod deps only)
        run: |
          rm -rf deploy
          mkdir -p deploy

          # Copia ciò che serve in runtime
          cp package.json package-lock.json deploy/
          cp -R server-dist deploy/server-dist

          # Installa solo production deps nella cartella deploy
          npm ci --omit=dev --prefix deploy

          # (Opzionale) verifica rapida che express ci sia
          test -d deploy/node_modules/express

          # Zip finale
          cd deploy
          zip -r ../deploy.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3657520D6E074B449CAC38EFA4EF8865 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_53ABC2563A1D4368A6B5EEC80EB3401A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DD0E651561084DFDB83AFFB2EE78E235 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: updatelens-api
          slot-name: Production
          package: deploy.zip
