name: Build and deploy Node.js app to Azure Web App - updatelens-api

on:
  push:
    branches:
      - Azure
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Detect Vite root (where index.html is)
        id: vite_root
        shell: bash
        run: |
          set -e
          INDEX_PATH="$(find . -maxdepth 6 -name index.html -not -path './node_modules/*' | head -n 1)"
          if [ -z "$INDEX_PATH" ]; then
            echo "index.html not found in repo (maxdepth 6)." >&2
            exit 1
          fi
          ROOT_DIR="$(dirname "$INDEX_PATH")"
          echo "Found index.html at: $INDEX_PATH"
          echo "VITE_ROOT=$ROOT_DIR" >> $GITHUB_ENV

      # Build frontend (Vite -> $VITE_ROOT/dist)
      - name: Build client
        shell: bash
        run: |
          set -e

          # Se esiste un vite.config.* dentro VITE_ROOT lo usiamo; altrimenti usiamo quello in root repo; altrimenti nulla.
          CONFIG_ARG=""
          if ls "$VITE_ROOT"/vite.config.* >/dev/null 2>&1; then
            CFG="$(ls "$VITE_ROOT"/vite.config.* | head -n 1)"
            CONFIG_ARG="--config $CFG"
          elif ls vite.config.* >/dev/null 2>&1; then
            CFG="$(ls vite.config.* | head -n 1)"
            CONFIG_ARG="--config $CFG"
          fi

          echo "Using VITE_ROOT=$VITE_ROOT"
          echo "Using CONFIG_ARG=$CONFIG_ARG"

          # ROOT è POSIZIONALE (niente --root)
          npx vite build "$VITE_ROOT" $CONFIG_ARG

          # Verifica output
          test -f "$VITE_ROOT/dist/index.html"

      # Build server (TS -> server-dist)
      - name: Build server
        run: npm run build:server

      - name: Create deploy package (dist + server-dist + prod deps only)
        shell: bash
        run: |
          set -e
          rm -rf deploy
          mkdir -p deploy

          # Runtime files
          cp package.json package-lock.json deploy/
          cp -R server-dist deploy/server-dist

          # Frontend build output
          cp -R "$VITE_ROOT/dist" deploy/dist

          # Install production deps in deploy folder
          npm ci --omit=dev --prefix deploy

          # Zip final
          cd deploy
          zip -r ../deploy.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3657520D6E074B449CAC38EFA4EF8865 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_53ABC2563A1D4368A6B5EEC80EB3401A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DD0E651561084DFDB83AFFB2EE78E235 }}

      - name: Disable Oryx build on App Service
        shell: bash
        run: |
          az webapp config appsettings set \
            --name updatelens-api \
            --resource-group rg-updatelens-test \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: updatelens-api
          slot-name: Production
          package: deploy.zip
