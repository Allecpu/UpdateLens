name: Build and deploy to Azure Web App - updatelens-api

on:
  push:
    branches:
      - Azure
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run CSS extract benchmark
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          CSS_EXTRACT_REQUIRE_AI: ${{ secrets.AZURE_OPENAI_API_KEY != '' && 'true' || 'false' }}
          CSS_AZURE_RETRY_MAX_ATTEMPTS: "3"
          CSS_AZURE_MAX_TEXT_CHARS: "10000"
        run: npm run test:css-extract

      - name: Build frontend (Vite)
        env:
          VITE_CHAT_BACKEND_ENABLED: "true"
          VITE_CHAT_AZURE_LLM_ENABLED: "true"
        run: npm run build

      - name: Build server (TypeScript)
        run: npm run build:server

      - name: Create deploy package
        run: |
          mkdir -p deploy

          # Copy server build output
          cp -R server-dist deploy/server-dist

          # Copy frontend build output
          cp -R dist deploy/dist

          # Copy tools folder (for refresh scripts)
          cp -R tools deploy/tools

          # Copy public folder (for data storage)
          cp -R public deploy/public

          # Copy source files needed for builds
          cp -R src deploy/src
          cp vite.config.ts deploy/
          cp tsconfig.json deploy/
          cp tsconfig.node.json deploy/ 2>/dev/null || true
          cp tsconfig.app.json deploy/ 2>/dev/null || true
          cp tailwind.config.js deploy/ 2>/dev/null || true
          cp postcss.config.js deploy/ 2>/dev/null || true
          cp index.html deploy/

          # Copy server tsconfig for tools that might need it
          mkdir -p deploy/server
          cp server/tsconfig.json deploy/server/

          # Copy package files
          cp package.json package-lock.json deploy/

          # Install ALL dependencies (including dev for refresh/build scripts)
          cd deploy
          npm ci
          if [ ! -d "node_modules/express" ]; then
            echo "ERROR: express not installed in deploy/node_modules"
            exit 1
          fi

          # Verify structure
          echo "=== Deploy folder structure ==="
          ls -la
          echo "=== Tools folder ==="
          ls tools/

          # Create zip for deployment
          zip -r ../deploy.zip . -x "*.git*"

          # Show zip size
          echo "=== Zip size ==="
          ls -lh ../deploy.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: updatelens-api
          slot-name: Production
          package: deploy.zip

      - name: Configure Azure App Settings (post-deploy)
        run: |
          az webapp config appsettings set \
            --name updatelens-api \
            --resource-group rg-updatelens-runtime \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false \
              WEBSITE_NODE_DEFAULT_VERSION="~20" \
              DB_PATH="/home/data"

      - name: Configure Chatbot Azure settings (optional)
        env:
          CHAT_ENGINE: ${{ vars.CHAT_ENGINE }}
          CHAT_AZURE_MIN_CONFIDENCE: ${{ vars.CHAT_AZURE_MIN_CONFIDENCE }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: |
          SETTINGS=()

          if [ -n "$CHAT_ENGINE" ]; then
            SETTINGS+=("CHAT_ENGINE=$CHAT_ENGINE")
          fi
          if [ -n "$CHAT_AZURE_MIN_CONFIDENCE" ]; then
            SETTINGS+=("CHAT_AZURE_MIN_CONFIDENCE=$CHAT_AZURE_MIN_CONFIDENCE")
          fi
          if [ -n "$AZURE_OPENAI_ENDPOINT" ]; then
            SETTINGS+=("AZURE_OPENAI_ENDPOINT=$AZURE_OPENAI_ENDPOINT")
          fi
          if [ -n "$AZURE_OPENAI_API_KEY" ]; then
            SETTINGS+=("AZURE_OPENAI_API_KEY=$AZURE_OPENAI_API_KEY")
          fi
          if [ -n "$AZURE_OPENAI_DEPLOYMENT" ]; then
            SETTINGS+=("AZURE_OPENAI_DEPLOYMENT=$AZURE_OPENAI_DEPLOYMENT")
          fi
          if [ -n "$AZURE_OPENAI_API_VERSION" ]; then
            SETTINGS+=("AZURE_OPENAI_API_VERSION=$AZURE_OPENAI_API_VERSION")
          fi
          if [ -n "$APPLICATIONINSIGHTS_CONNECTION_STRING" ]; then
            SETTINGS+=("APPLICATIONINSIGHTS_CONNECTION_STRING=$APPLICATIONINSIGHTS_CONNECTION_STRING")
          fi

          if [ ${#SETTINGS[@]} -eq 0 ]; then
            echo "No chatbot Azure settings provided; skipping."
            exit 0
          fi

          az webapp config appsettings set \
            --name updatelens-api \
            --resource-group rg-updatelens-runtime \
            --settings "${SETTINGS[@]}"

      - name: Set startup command and Always On
        run: |
          az webapp config set \
            --name updatelens-api \
            --resource-group rg-updatelens-runtime \
            --startup-file "node /home/site/wwwroot/server-dist/index.js" \
            --always-on true

      - name: Configure Easy Auth (if secrets are set)
        if: ${{ vars.ENABLE_EASY_AUTH == 'true' }}
        env:
          AUTH_CLIENT_ID: ${{ secrets.AZURE_AUTH_CLIENT_ID }}
          AUTH_CLIENT_SECRET: ${{ secrets.AZURE_AUTH_CLIENT_SECRET }}
          AUTH_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          # Upgrade to auth config v2 if needed
          az webapp auth config-version upgrade \
            --name updatelens-api \
            --resource-group rg-updatelens-runtime 2>/dev/null || echo "Already on auth v2"

          # Configure Microsoft identity provider
          az webapp auth microsoft update \
            --name updatelens-api \
            --resource-group rg-updatelens-runtime \
            --client-id "$AUTH_CLIENT_ID" \
            --client-secret "$AUTH_CLIENT_SECRET" \
            --issuer "https://login.microsoftonline.com/$AUTH_TENANT_ID/v2.0" \
            --yes

          # Enable authentication with redirect
          az webapp auth update \
            --name updatelens-api \
            --resource-group rg-updatelens-runtime \
            --enabled true \
            --action RedirectToLoginPage \
            --unauthenticated-client-action RedirectToLoginPage

          echo "Easy Auth configured successfully"

      - name: Restart App Service
        run: |
          az webapp restart \
            --name updatelens-api \
            --resource-group rg-updatelens-runtime
